name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: cs2pr

      - name: Run PHP lint
        run: |
          errors=0
          for file in $(find . -name "*.php" -not -path "./vendor/*" -not -path "./.github/*"); do
            if ! php -l "$file" > /dev/null 2>&1; then
              php -l "$file"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::error::$errors file(s) had syntax errors"
            exit 1
          fi
          echo "All PHP files passed syntax check"

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          required_files=(
            "wom-toolkit.php"
            "uninstall.php"
            "readme.txt"
            "core/class-plugin.php"
            "core/class-admin.php"
            "core/class-modules.php"
            "core/class-settings.php"
            "core/class-updater.php"
            "core/class-module-manager.php"
            "core/class-base-module.php"
            "modules/custom-cursor/class-module.php"
            "modules/smooth-scrolling/class-module.php"
            "modules/login-branding/class-module.php"
            "modules/scrollbar-styles/class-module.php"
            "modules/smooth-scrolling/assets/vendor/lenis.min.js"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Missing required file: $file"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "::error::$missing required file(s) missing"
            exit 1
          fi
          echo "All required files present"
